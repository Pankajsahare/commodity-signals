<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agri Commodity Snapshot — NCDEX | Advisor4u</title>
<meta name="description" content="Daily snapshot of NCDEX agri commodity futures prices (end-of-day, from the exchange bhavcopy) with upcoming contract expiries.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Public snapshot — फक्त भाव + expiry, signals नाहीत. Elementor मध्येही हाच code वापरता येतो (#csnap). */
#csnap{--bg:#ffffff;--card:#f6f8fb;--line:#e3e8ef;--text:#14202e;--muted:#5f6b7a;--up:#1f6feb;--dn:#d4570f;
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);max-width:1100px;margin:0 auto;padding:16px}
#csnap h1{font-size:22px;margin:0 0 4px}#csnap .mut{color:var(--muted);font-size:13px}
#csnap .sec{margin:18px 0 8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
#csnap .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#csnap .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#csnap .c b{display:block}#csnap .p{font-size:20px;font-weight:700;margin-top:2px}
#csnap .up{color:var(--up)}#csnap .dn{color:var(--dn)}
#csnap table{width:100%;border-collapse:collapse;font-size:14px}#csnap td{padding:6px;border-bottom:1px solid var(--line)}
#csnap .cta{margin-top:20px;padding:14px;border-radius:12px;background:#eef4ff;border:1px solid #cfe0ff}
#csnap a{color:var(--up)}
</style>
</head>
<body>
<div id="csnap"><h1>Commodity Market Snapshot</h1><div class="mut">Loading…</div></div>
<script>
(function(){
  var BASE="https://pankajsahare.github.io/commodity-signals/";
  var el=document.getElementById("csnap");
  function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function fmt(n){return n==null?"—":Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
  // जुना service worker (आधीच्या app चा) काढून टाकतो
  if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
  fetch(BASE+"snapshot.json?ts="+Date.now()).then(function(r){return r.json()}).then(function(s){
    var secs={};s.rows.filter(function(r){return r.price!=null}).forEach(function(r){(secs[r.sector]=secs[r.sector]||[]).push(r)});
    var up=new Date(s.updatedAt).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    var h='<h1>Commodity Market Snapshot</h1><div class="mut">NCDEX agri futures (end-of-day) · Updated '+up+' IST</div>';
    Object.keys(secs).forEach(function(k){
      h+='<div class="sec">'+esc(k)+'</div><div class="grid">'+secs[k].map(function(r){
        var c=r.chgPct;return '<div class="c"><b>'+esc(r.name)+'</b><span class="mut">'+esc(r.exch)+' · '+esc(r.unit)+'</span><div class="p">'+fmt(r.price)+'</div>'+
        (c==null?'':'<span class="'+(c>=0?"up":"dn")+'">'+(c>=0?"▲ +":"▼ ")+c.toFixed(2)+'%</span>')+'</div>'}).join("")+'</div>';
    });
    if(s.expiries&&s.expiries.length){h+='<div class="sec">Upcoming contract expiries</div><table>'+s.expiries.slice(0,12).map(function(e){return '<tr><td>'+esc(e.name)+' <span class="mut">'+esc(e.exch)+'</span></td><td style="text-align:right">'+esc(e.exp)+'</td></tr>'}).join("")+'</table>'}
    h+='<div class="cta">Want daily market updates? Join our Telegram channel <a href="https://t.me/saharewealth" target="_blank" rel="noopener">t.me/saharewealth</a> or chat with us on <a href="https://wa.me/919405908605" target="_blank" rel="noopener">WhatsApp</a>.</div>'+
      '<p class="mut">Prices are end-of-day settlement data from the NCDEX bhavcopy and may differ from live quotes. For information only — not a recommendation to buy or sell.</p>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<h1>Commodity Market Snapshot</h1><div class="mut">Data is temporarily unavailable. Please check back shortly.</div>'});
})();
</script>
</body>
</html>
