# दर 5 मिनिटांला भाव fetch करून data.json repo मध्ये लिहितो (सोम-शुक्र, MCX market hours)
name: fetch-data
on:
  schedule:
    - cron: "*/5 4-18 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch-data
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and write data.json
        run: python scripts/fetch_data.py
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update data.json"
          git push
