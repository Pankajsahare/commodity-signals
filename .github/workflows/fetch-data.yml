# दर 5 मिनिटांला भाव fetch करून थेट GitHub Pages वर deploy करतो — repo मध्ये data commits नाहीत.
# MCX वेळ: 09:00–23:30/23:55 IST = 03:30–18:25 UTC (सोम-शुक्र)
# गरज: Settings → Pages → Source = "GitHub Actions"
name: fetch-data
on:
  schedule:
    - cron: "*/5 3-18 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and build data.json
        run: python scripts/fetch_data.py
      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.json icon.svg data.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
