# रोज रात्री 00:15 IST (market बंद झाल्यावर) ताजा data काढून सारांश Telegram वर पाठवतो
name: telegram-summary
on:
  schedule:
    - cron: "45 18 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh data
        run: python scripts/fetch_data.py
      - name: Send daily summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_summary.py
